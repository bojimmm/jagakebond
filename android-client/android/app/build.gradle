apply plugin: 'com.android.application'

// Release signing reuses the keystore every installed APK was signed with (the standard Android debug keystore), so the
// release build updates the installed app in place. Path, alias and passwords can be overridden with Gradle properties
// (-Pjk.keystore=..., jk.keystore.alias, jk.keystore.password, jk.key.password) or the JK_* environment variables.
// The build never creates or replaces this file.
def jkSetting(String property, String env, String fallback) {
    def value = project.findProperty(property)
    if (value == null || value.toString().isEmpty()) value = System.getenv(env)
    return (value == null || value.toString().isEmpty()) ? fallback : value.toString()
}
def jkAndroidHome = System.getenv('ANDROID_USER_HOME') ?: (System.getProperty('user.home') + '/.android')

android {
    namespace = "jagake.bond.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "jagake.bond.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 56
        versionName "0.2.4.28"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        shared {
            storeFile file(jkSetting('jk.keystore', 'JK_KEYSTORE', jkAndroidHome + '/debug.keystore'))
            storePassword jkSetting('jk.keystore.password', 'JK_KEYSTORE_PASSWORD', 'android')
            keyAlias jkSetting('jk.keystore.alias', 'JK_KEY_ALIAS', 'androiddebugkey')
            keyPassword jkSetting('jk.key.password', 'JK_KEY_PASSWORD', 'android')
        }
    }
    buildTypes {
        // debug keeps WebView debugging and Capacitor logging (src/debug/assets/capacitor.config.json)
        release {
            signingConfig signingConfigs.shared
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime:2.10.1"
    implementation "androidx.exifinterface:exifinterface:1.4.1"
    // "Masuk dengan Google" (0.2.3.9): Credential Manager + Google ID token (Google blocks its web sign-in in WebViews).
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20260814"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

