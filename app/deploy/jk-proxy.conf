# Shared proxy headers for JagaKebond.
# Referenced by deploy/nginx.conf as /etc/nginx/snippets/jk-proxy.conf
#
# These are what make uvicorn's --proxy-headers trustworthy: because uvicorn is told to
# accept forwarding only from 127.0.0.1, and nginx overwrites (never appends to) these
# headers, a client cannot spoof its own IP.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_connect_timeout 10s;
proxy_send_timeout    70s;
proxy_read_timeout    70s;
proxy_buffering       on;
