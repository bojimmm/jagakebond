# JagaKebond — nginx reverse proxy (TLS termination in front of uvicorn on 127.0.0.1:8010)
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/jagakebond
#   sudo ln -s /etc/nginx/sites-available/jagakebond /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d jagakebond.example.com      # rewrites the ssl_* lines
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace jagakebond.example.com with your real domain before using this.

# Login attempts get their own bucket here as a coarse first line of defence. The app
# also throttles in SQLite: 5 failures lock that IP+e-mail pair, more than 10 failures
# for one e-mail within 15 minutes (from any IPs) lock that address for 30-120 s, and 50
# failures lock the IP (IPv6 clients are counted per /64). The per-IP limit is
# deliberately loose so a village sharing one public IP is not locked out.
limit_req_zone $binary_remote_addr zone=jk_login:10m rate=12r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name jagakebond.example.com;

    # Let certbot serve its challenge over plain HTTP, then force HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jagakebond.example.com;

    ssl_certificate     /etc/letsencrypt/live/jagakebond.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jagakebond.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Photo uploads: the app caps at MAX_UPLOAD_MB (12 by default) and answers 413 early
    # when Content-Length exceeds MAX_UPLOAD_MB + 1 MB of multipart overhead. Keep this
    # proxy limit at least that large, or nginx's 413 page wins over the app's message.
    client_max_body_size 14m;
    client_body_timeout 60s;

    # Security headers: deliberately NOT added here. The app (backend/app.py) sends one
    # consistent set on every response it produces — X-Content-Type-Options,
    # X-Frame-Options, Referrer-Policy, Permissions-Policy, Strict-Transport-Security
    # (when COOKIE_SECURE=1) and a Content-Security-Policy per page type (field app vs
    # /admin) — and repeating them here would send every header twice. If you want them
    # on nginx's own error pages too, add them only inside dedicated error_page locations.

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/jagakebond.access.log;
    error_log  /var/log/nginx/jagakebond.error.log;

    location = /api/auth/login {
        limit_req zone=jk_login burst=6 nodelay;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/snippets/jk-proxy.conf;
    }

    location = /api/auth/register {
        limit_req zone=jk_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/snippets/jk-proxy.conf;
    }

    # Sign in with Google (0.2.3.0): same budget as the password login.
    location = /api/auth/google {
        limit_req zone=jk_login burst=6 nodelay;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/snippets/jk-proxy.conf;
    }

    # Everything else: the API, the PWA shell and the admin console.
    location / {
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/snippets/jk-proxy.conf;
    }
}
