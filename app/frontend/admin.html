  /* health headline */

  .health-bad { border-color: #fca5a5; background: #fef2f2; }
  .health-icon { flex: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; }
  .health-ok .health-icon { background: var(--jk-green-700, #15803d); }

  /* responsive tables: a table from 768px, stacked cards below */
  .rtable { width: 100%; border-collapse: collapse; }

  /* settings */
  .setting + .setting { margin-top: 16px; padding-top: 16px; border-top: 1px solid #eef2f6; }

  .pw-row { display: flex; align-items: stretch; gap: 8px; }
  .pw-row > .input { flex: 1 1 0; min-width: 0; }
  .settings-bar { display: flex; flex-direction: column; gap: 12px; border-radius: 12px; border: 1px solid var(--jk-border, #dbe3e8); }
  @media (min-width: 768px) { .settings-bar { flex-direction: row; align-items: flex-end; justify-content: space-between; } .settings-bar .bar-fields { flex: 1 1 0; max-width: 420px; } }

  /* toolbars */
  .toolbar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  @media (min-width: 640px) { .toolbar { grid-template-columns: minmax(0, 1fr) 200px auto; align-items: stretch; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }

  /* registration inbox (0.2.3.0) */
  .reg-list > li { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid #eef2f6; }
  .reg-list > li:first-child { border-top: 0; padding-top: 0; }
  @media (min-width: 640px) { .reg-list > li { flex-direction: row; align-items: center; justify-content: space-between; } .reg-list .btn-row { flex: none; width: 240px; } }

  /* dialog, toast */
  .modal-backdrop { position: fixed; inset: 0; z-index: var(--jk-z-modal, 50); display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(15, 23, 42, 0.6); }
  .dialog { width: 100%; max-width: 480px; max-height: min(90vh, 760px); overflow-y: auto; box-shadow: var(--jk-shadow-raised); }
  .dialog:focus { outline: none; }
  .toast-region { position: fixed; top: 16px; left: 16px; right: 16px; z-index: var(--jk-z-toast, 40); display: flex; justify-content: center; pointer-events: none; }
  /* Phones: toasts at the bottom, never over Aplikasi / Keluar (0.2.4.15). */
  @media (max-width: 767px) { .toast-region { top: auto; bottom: max(16px, env(safe-area-inset-bottom)); } }
  .toast { pointer-events: auto; max-width: 480px; padding: 12px 16px; border-radius: 12px; font-size: 15px; font-weight: 600; line-height: 1.4;
    box-shadow: var(--jk-shadow-raised); background: var(--jk-ink, #0f172a); color: #fff; }
  .toast-error { background: var(--jk-red-700, #b91c1c); }
  .toast-ok { background: var(--jk-green-700, #15803d); }
  .toast-warn { background: var(--jk-amber-500, #f59e0b); color: var(--jk-ink, #0f172a); }

  /* loading */
  .sk { height: 20px; margin-top: 8px; } .sk-lg { height: 72px; margin-top: 12px; }
  .btn[aria-busy="true"] { cursor: progress; }
  .btn[aria-busy="true"]::after { content: ''; flex: none; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: a-spin 0.8s linear infinite; }
  @keyframes a-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .btn[aria-busy="true"]::after { animation: none; } }
.brand { width: 40px; height: 40px; flex: none; border-radius: 10px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; display: flex; align-items: center; justify-content: center; } .brand img { display:block; width:30px; height:30px; object-fit:contain; }
.card { background: #ffffff; border: 1px solid #dce6df; border-radius: 12px; box-shadow: 0 1px 2px rgba(13, 31, 18, 0.04); }

.badge-healthy { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
.badge-moderate { background: #fffbeb; border-color: #fde68a; color: #b45309; }

.health-banner.is-warn { background: linear-gradient(135deg, #fffbeb 0%, #ffffff 70%); border-color: #fde68a; }

.health-banner-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }

<body>

<div id="app">

  <!-- ===================== LOADING (until the script decides which view to show) ===================== -->
  <div id="boot-view" class="a-center" role="status">
    <p class="t-body t-muted">Memuat konsol admin…<br><span class="t-meta">Jika layar ini tidak berubah, muat ulang halaman.</span></p>
  </div>

  <!-- ===================== LOGIN ===================== -->
  <main id="login-view" class="a-center" hidden>
    <div class="card a-narrow">
      <div class="a-row">
        <div class="brand" aria-hidden="true"><img src="/icons/logo-256.png?v=3" alt="" width="36" height="36"></div>
        <div>
          <h1 class="t-title">Konsol Admin</h1>
          <p class="t-meta">JagaKebond</p>
        </div>
      </div>
      <form id="login-form" class="a-stack-16 mt4" data-form="login" novalidate>
        <div id="login-notice" class="notice notice-info" role="status" hidden></div>
        <div>
          <label class="label" for="login-email">Email</label>
          <input id="login-email" class="input" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required>
        </div>
        <div>
          <label class="label" for="login-password">Kata sandi</label>
          <div class="pw-row">
            <input id="login-password" class="input" type="password" autocomplete="current-password" required>
            <button type="button" class="btn btn-secondary" data-action="toggle-password" data-target="login-password" aria-controls="login-password" aria-pressed="false">Tampilkan</button>
          </div>
        </div>
        <div id="login-error" class="notice notice-error" role="alert" hidden></div>
        <button type="submit" class="btn btn-primary btn-block">Masuk</button>
      </form>
    </div>
  </main>

  <!-- ===================== DENIED ===================== -->
  <main id="denied-view" class="a-center" hidden>
    <div class="card a-narrow a-stack-16">
      <div>
        <h1 class="t-title">Akses Ditolak</h1>
        <p class="t-body mt2">Halaman ini hanya untuk admin. Akun Anda masuk sebagai pengguna biasa.</p>
      </div>
      <div class="btn-stack">
        <a class="btn btn-primary" href="/">Buka aplikasi petani</a>
        <button type="button" class="btn btn-secondary" data-action="logout">Keluar</button>
      </div>
    </div>
  </main>

  <!-- ===================== CONSOLE ===================== -->
  <div id="console-view" class="a-wrap a-stack" hidden>
    <header class="card a-header">
      <div class="a-row a-grow">
        <div class="brand" aria-hidden="true"><img src="/icons/logo-256.png?v=3" alt="" width="36" height="36"></div>
        <div class="a-grow">
          <h1>Konsol Admin</h1>
          <p class="t-meta break" id="me-label">—</p>
        </div>
      </div>
      <div class="a-row-8 a-none">
        <a class="btn btn-secondary btn-sm" href="/">Aplikasi</a>
        <button type="button" class="btn btn-secondary btn-sm" data-action="logout">Keluar</button>
      </div>
    </header>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Menu konsol admin">
      <button type="button" class="tab" role="tab" id="tab-overview" data-action="tab" data-tab="overview" aria-controls="panel-overview" aria-selected="true"><i data-lucide="house" aria-hidden="true"></i><span>Beranda</span></button>
      <button type="button" class="tab" role="tab" id="tab-accounts" data-action="tab" data-tab="accounts" aria-controls="panel-accounts" aria-selected="false" tabindex="-1"><i data-lucide="users" aria-hidden="true"></i><span>Akun</span></button>
      <button type="button" class="tab" role="tab" id="tab-settings" data-action="tab" data-tab="settings" aria-controls="panel-settings" aria-selected="false" tabindex="-1"><i data-lucide="settings" aria-hidden="true"></i><span>Setelan</span></button>
      <button type="button" class="tab" role="tab" id="tab-queue" data-action="tab" data-tab="queue" aria-controls="panel-queue" aria-selected="false" tabindex="-1"><i data-lucide="list-ordered" aria-hidden="true"></i><span>Antrean</span></button>
      <button type="button" class="tab" role="tab" id="tab-audit" data-action="tab" data-tab="audit" aria-controls="panel-audit" aria-selected="false" tabindex="-1"><i data-lucide="scroll-text" aria-hidden="true"></i><span>Audit</span></button>
    </nav>

    <main id="main" class="a-stack" tabindex="-1">
      <section id="panel-overview" class="a-stack" role="tabpanel" aria-labelledby="tab-overview" tabindex="0"></section>
      <section id="panel-accounts" class="a-stack" role="tabpanel" aria-labelledby="tab-accounts" tabindex="0" hidden></section>
      <section id="panel-settings" class="a-stack" role="tabpanel" aria-labelledby="tab-settings" tabindex="0" hidden></section>
      <section id="panel-queue" class="a-stack" role="tabpanel" aria-labelledby="tab-queue" tabindex="0" hidden></section>
      <section id="panel-audit" class="a-stack" role="tabpanel" aria-labelledby="tab-audit" tabindex="0" hidden></section>
    </main>
  </div>

  <noscript>
    <div class="a-center"><p class="notice notice-error">Konsol admin membutuhkan JavaScript. Aktifkan JavaScript lalu muat ulang halaman.</p></div>
  </noscript>
</div>

<!-- Dialogs and toasts live outside #app so the page behind a dialog can be made inert. -->
<div id="modal" class="modal-backdrop" hidden></div>
<div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>

</body>
</html>
